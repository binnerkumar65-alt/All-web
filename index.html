<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Cloud App</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; padding-bottom: 70px; }
    
    .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { color: #38bdf8; margin: 0; font-size: 1.4rem; }
    
    .top-btns { display: flex; gap: 8px; align-items: center; }
    .icon-btn { background: #38bdf8; color: #0f172a; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(56,189,248,0.3); }
    .action-btn { background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; padding: 0 10px; height: 36px; border-radius: 18px; font-size: 0.8rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; }
    .logout-btn { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }

    .device-info { background: #1e293b; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; margin-bottom: 20px; color: #38bdf8; border: 1px solid #334155; display: inline-block; }
    
    .view-section { width: 100%; max-width: 500px; display: none; }
    .view-section.active { display: block; }

    /* గैलरी स्टाइल */
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
    @media (max-width: 400px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }

    .gallery-card { background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; display: flex; flex-direction: column; cursor: pointer; aspect-ratio: 1 / 1; position: relative; user-select: none; }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; }
    .photo-date { position: absolute; bottom: 0; background: rgba(15, 23, 42, 0.8); width: 100%; font-size: 0.65rem; color: #cbd5e1; text-align: center; padding: 3px 0; }
    
    .gallery-card.selected { border: 3px solid #38bdf8; transform: scale(0.96); }
    .gallery-card.selected::after { content: '✔'; position: absolute; top: 6px; right: 6px; background: #38bdf8; color: #0f172a; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; }

    /* नोट्स स्टाइल */
    .notes-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    textarea { width: 100%; height: 100px; background: #1e293b; color: #fff; border: 1px solid #334155; padding: 12px; border-radius: 8px; box-sizing: border-box; font-size: 1rem; resize: vertical; }
    .save-note-btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
    .note-card { background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 8px; margin-bottom: 10px; word-break: break-word; font-size: 0.9rem; line-height: 1.4; color: #e2e8f0; }

    /* एक्शन बार */
    .action-bar { display: none; position: fixed; bottom: 15px; background: #1e293b; border: 1px solid #334155; padding: 10px 20px; border-radius: 30px; z-index: 1500; gap: 15px; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .delete-btn-bar { background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
    .cancel-select-btn { background: transparent; color: #94a3b8; border: none; cursor: pointer; font-size: 0.9rem; }

    /* मोडल */
    .modal { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: center; flex-direction: column; padding: 20px; box-sizing: border-box; }
    .modal img { max-width: 100%; max-height: 75vh; border-radius: 8px; object-fit: contain; }
    .modal-date { margin-top: 12px; color: #38bdf8; font-size: 0.85rem; }
    .close-modal { position: absolute; top: 20px; right: 20px; background: #ef4444; color: #fff; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }

    .auth-overlay { display: none; position: fixed; z-index: 3000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
    .auth-box { background: #1e293b; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 15px; }
    .auth-box h3 { margin: 0; color: #38bdf8; text-align: center; }
    .auth-box input { padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 1rem; }
    .auth-box button { padding: 10px; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .auth-box .switch-mode { font-size: 0.8rem; text-align: center; color: #94a3b8; cursor: pointer; }
    .auth-box .switch-mode span { color: #38bdf8; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="header">
    <h2 id="pageTitle">Cloud Gallery</h2>
    <div class="top-btns" id="topBtnsContainer"></div>
  </div>

  <div class="device-info">🔑 ID: <strong id="devCode">...</strong></div>

  <input type="file" id="hiddenFileInput" accept="image/*" multiple style="display: none;" onchange="uploadImagesSequentially()">
  
  <!-- गैलरी सेक्शन -->
  <div class="view-section active" id="gallerySection">
    <div class="gallery-grid" id="gallery">तस्वीरें लोड हो रही हैं...</div>
  </div>

  <!-- नोट्स सेक्शन -->
  <div class="view-section" id="notesSection">
    <div class="notes-box">
      <textarea id="noteInput" placeholder="यहाँ नया नोट लिखें..."></textarea>
      <button class="save-note-btn" onclick="saveNote()">नोट्स सेव करें</button>
    </div>
    <div id="notesList">नोट्स लोड हो रहे हैं...</div>
  </div>

  <!-- डिलीट floating एक्शन बार -->
  <div class="action-bar" id="actionBar">
    <span id="selectedCountText" style="font-size: 0.9rem; color: #38bdf8; font-weight: bold;">0 selected</span>
    <button class="delete-btn-bar" onclick="deleteSelectedPhotos()">Delete</button>
    <button class="cancel-select-btn" onclick="clearSelection()">Cancel</button>
  </div>

  <!-- ज़ूम मोडल -->
  <div class="modal" id="imgModal">
    <button class="close-modal" onclick="closeZoom()">×</button>
    <img id="fullImg" src="">
    <div class="modal-date" id="modalDate"></div>
  </div>

  <!-- पासवर्ड/अकाउंट मोडल -->
  <div class="auth-overlay" id="authModal">
    <div class="auth-box">
      <h3 id="authTitle">अकाउंट सेट करें</h3>
      <input type="text" id="authIdInput" placeholder="5-अंक की ID">
      <input type="password" id="authPassInput" placeholder="पासवर्ड दर्ज करें">
      <button id="authBtn" onclick="submitAuth()">आगे बढ़ें</button>
      <div class="switch-mode" id="switchText" onclick="toggleAuthMode()">पुराना अकाउंट है? <span>लॉगिन करें</span></div>
    </div>
  </div>

  <script>
    const API_BASE = "https://pdf-chaker-1.onrender.com/api";
    let isLoginMode = false;
    let selectedPhotoIds = new Set();
    let isSelectionMode = false;
    let currentTab = 'gallery'; // 'gallery' या 'notes'

    function toggleView(tab) {
      currentTab = tab;
      const gallerySec = document.getElementById('gallerySection');
      const notesSec = document.getElementById('notesSection');
      const title = document.getElementById('pageTitle');
      const uploadBtn = document.getElementById('uploadBtn');

      if (tab === 'notes') {
        gallerySec.classList.remove('active');
        notesSec.classList.add('active');
        title.innerText = "Cloud Notes";
        if(uploadBtn) uploadBtn.style.display = 'none';
        fetchNotes(DEVICE_ID());
      } else {
        notesSec.classList.remove('active');
        gallerySec.classList.add('active');
        title.innerText = "Cloud Gallery";
        if(uploadBtn) uploadBtn.style.display = 'flex';
        fetchGallery(DEVICE_ID());
      }
      updateHeaderButtons();
    }

    function updateHeaderButtons() {
      const container = document.getElementById('topBtnsContainer');
      const savedPass = localStorage.getItem('device_password');

      let viewToggleBtn = currentTab === 'gallery' 
        ? `<button class="action-btn" onclick="toggleView('notes')">📝 Notes</button>`
        : `<button class="action-btn" onclick="toggleView('gallery')">🖼️ Gallery</button>`;

      if (savedPass) {
        container.innerHTML = `
          ${viewToggleBtn}
          <button class="action-btn logout-btn" onclick="logoutUser()">Logout</button>
          <button class="icon-btn" id="uploadBtn" onclick="triggerUpload()" title="Upload Photo" style="${currentTab==='notes'?'display:none;':''}">+</button>
        `;
      } else {
        container.innerHTML = `
          ${viewToggleBtn}
          <button class="action-btn" onclick="openLoginModal()">Login</button>
          <button class="icon-btn" id="uploadBtn" onclick="triggerUpload()" title="Upload Photo" style="${currentTab==='notes'?'display:none;':''}">+</button>
        `;
      }
    }

    function initUser() {
      let devId = localStorage.getItem('device_5digit_code');
      let pass = localStorage.getItem('device_password');

      if (!devId) {
        devId = Math.floor(10000 + Math.random() * 90000).toString();
        localStorage.setItem('device_5digit_code', devId);
      }

      document.getElementById('devCode').innerText = devId;
      updateHeaderButtons();

      if (!pass) {
        showAuthPopup(false);
      } else {
        fetchGallery(devId);
      }
    }

    const DEVICE_ID = () => localStorage.getItem('device_5digit_code');

    /* === 1. गैलरी लॉजिक + स्थानीय 10 फोटो कैश === */
    function renderPhotos(photos) {
      const container = document.getElementById('gallery');
      if (!photos || photos.length === 0) {
        container.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#94a3b8; margin-top:30px;'>कोई फोटो मौजूद नहीं है।</p>";
        return;
      }

      container.innerHTML = "";
      photos.forEach(p => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        if (selectedPhotoIds.has(p.id)) {
          card.classList.add('selected');
        }
        
        const dateObj = new Date(p.date);
        const formattedDate = dateObj.toLocaleDateString() + " " + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        card.onclick = () => {
          if (isSelectionMode) {
            toggleSelectPhoto(p.id, card);
          } else {
            openModal(p.url, formattedDate);
          }
        };

        card.oncontextmenu = (e) => {
          e.preventDefault();
          startSelectionMode(p.id, card);
        };

        let pressTimer;
        card.ontouchstart = () => {
          pressTimer = setTimeout(() => {
            startSelectionMode(p.id, card);
          }, 600);
        };
        card.ontouchend = () => clearTimeout(pressTimer);
        card.ontouchmove = () => clearTimeout(pressTimer);
        
        card.innerHTML = `
          <img src="${p.url}" loading="lazy">
          <div class="photo-date">${formattedDate}</div>
        `;
        container.appendChild(card);
      });
    }

    async function fetchGallery(targetId) {
      // 10 फोटो लोकल कैश से दिखाएं
      const cachedPhotos = localStorage.getItem(`cached_photos_${targetId}`);
      if (cachedPhotos) {
        renderPhotos(JSON.parse(cachedPhotos));
      }

      // सर्वर से ताज़ा फोटो लाएं
      try {
        const res = await fetch(`${API_BASE}/gallery?device_id=${targetId}`);
        const photos = await res.json();
        
        if (Array.isArray(photos)) {
          // शुरुआती 10 फोटो को कैश में अपडेट करें
          const top10 = photos.slice(0, 10);
          localStorage.setItem(`cached_photos_${targetId}`, JSON.stringify(top10));
          
          renderPhotos(photos);
        }
      } catch (err) {
        console.error("Gallery fetch failed:", err);
      }
    }

    /* === 2. नोट्स लॉजिक (Server Sync) === */
    async function fetchNotes(targetId) {
      const list = document.getElementById('notesList');
      try {
        const res = await fetch(`${API_BASE}/notes?device_id=${targetId}`);
        const notes = await res.json();
        
        list.innerHTML = "";
        if (!notes || notes.length === 0) {
          list.innerHTML = "<p style='text-align:center; color:#94a3b8; margin-top:20px;'>कोई नोट मौजूद नहीं है।</p>";
          return;
        }

        notes.forEach(n => {
          const card = document.createElement('div');
          card.className = 'note-card';
          card.innerText = n.text;
          list.appendChild(card);
        });
      } catch (err) {
        list.innerHTML = "<p style='text-align:center; color:#ef4444;'>नोट्स लोड नहीं हो पाए।</p>";
      }
    }

    async function saveNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();
      const pass = localStorage.getItem('device_password');

      if (!pass) {
        showAuthPopup(false);
        return;
      }
      if (!text) {
        alert("कृपया कुछ टेक्स्ट लिखें!");
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/notes/add`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_id: DEVICE_ID(), text: text })
        });
        const data = await res.json();
        if (data.success) {
          input.value = "";
          fetchNotes(DEVICE_ID());
        } else {
          alert("नोट सेव करने में विफल: " + (data.error || ""));
        }
      } catch (err) {
        alert("सर्वर एरर! नोट सेव नहीं हो सका।");
      }
    }

    /* === फोटो सिलेक्शन और डिलीट === */
    function startSelectionMode(id, cardElement) {
      isSelectionMode = true;
      toggleSelectPhoto(id, cardElement);
    }

    function toggleSelectPhoto(id, cardElement) {
      if (selectedPhotoIds.has(id)) {
        selectedPhotoIds.delete(id);
        cardElement.classList.remove('selected');
      } else {
        selectedPhotoIds.add(id);
        cardElement.classList.add('selected');
      }

      if (selectedPhotoIds.size > 0) {
        isSelectionMode = true;
        document.getElementById('actionBar').style.display = 'flex';
        document.getElementById('selectedCountText').innerText = `${selectedPhotoIds.size} selected`;
      } else {
        clearSelection();
      }
    }

    function clearSelection() {
      selectedPhotoIds.clear();
      isSelectionMode = false;
      document.getElementById('actionBar').style.display = 'none';
      fetchGallery(DEVICE_ID());
    }

    async function deleteSelectedPhotos() {
      if (selectedPhotoIds.size === 0) return;
      if (!confirm(`क्या आप ${selectedPhotoIds.size} चुनी हुई फोटो को डिलीट करना चाहते हैं?`)) return;

      const idsArray = Array.from(selectedPhotoIds);
      document.getElementById('pageTitle').innerText = "Deleting...";

      try {
        const res = await fetch(`${API_BASE}/delete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ photo_ids: idsArray })
        });
        const data = await res.json();
        if (data.success) {
          clearSelection();
          document.getElementById('pageTitle').innerText = "Cloud Gallery";
          fetchGallery(DEVICE_ID());
        } else {
          alert("Error: " + data.error);
          document.getElementById('pageTitle').innerText = "Cloud Gallery";
        }
      } catch (err) {
        alert("Delete Failed!");
        document.getElementById('pageTitle').innerText = "Cloud Gallery";
      }
    }

    function triggerUpload() {
      const pass = localStorage.getItem('device_password');
      if (!pass) {
        showAuthPopup(false);
        return;
      }
      document.getElementById('hiddenFileInput').click();
    }

    async function uploadImagesSequentially() {
      const fileInput = document.getElementById('hiddenFileInput');
      const files = fileInput.files;
      if (!files || files.length === 0) return;

      const totalFiles = files.length;
      let successCount = 0;

      for (let i = 0; i < totalFiles; i++) {
        document.getElementById('pageTitle').innerText = `Uploading ${i + 1}/${totalFiles}...`;
        
        const formData = new FormData();
        formData.append('file', files[i]);
        formData.append('device_id', DEVICE_ID());

        try {
          const res = await fetch(`${API_BASE}/upload`, {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (data.success) {
            successCount++;
          }
        } catch (err) {
          console.error("Upload error for file index", i);
        }
      }

      fileInput.value = "";
      document.getElementById('pageTitle').innerText = "Cloud Gallery";
      fetchGallery(DEVICE_ID());
      
      if (successCount > 0) {
        alert(`${successCount} फोटो सफलतापूर्वक अपलोड हो गई!`);
      }
    }

    function openModal(url, dateStr) {
      document.getElementById('fullImg').src = url;
      document.getElementById('modalDate').innerText = "Uploaded: " + dateStr;
      document.getElementById('imgModal').style.display = 'flex';
    }
    function closeZoom() {
      document.getElementById('imgModal').style.display = 'none';
    }

    /* === ऑथेंटिकेशन / लॉगिन === */
    function showAuthPopup(login) {
      isLoginMode = login;
      const modal = document.getElementById('authModal');
      const idInput = document.getElementById('authIdInput');
      const passInput = document.getElementById('authPassInput');
      const title = document.getElementById('authTitle');
      const btn = document.getElementById('authBtn');
      const switchText = document.getElementById('switchText');

      modal.style.display = 'flex';
      passInput.value = "";

      if (isLoginMode) {
        title.innerText = "पुराने अकाउंट में लॉगिन करें";
        idInput.removeAttribute('readonly');
        idInput.value = "";
        idInput.placeholder = "अपनी 5-अंक की ID डालें";
        btn.innerText = "Login करें";
        switchText.innerHTML = "नया अकाउंट बनाना है? <span>यहाँ क्लिक करें</span>";
      } else {
        title.innerText = "सुरक्षा पासवर्ड बनाएं";
        idInput.setAttribute('readonly', true);
        idInput.value = localStorage.getItem('device_5digit_code') || '';
        btn.innerText = "पासवर्ड सेट करें";
        switchText.innerHTML = "पुराना अकाउंट है? <span>लॉगिन करें</span>";
      }
    }

    function openLoginModal() {
      showAuthPopup(true);
    }

    function toggleAuthMode() {
      showAuthPopup(!isLoginMode);
    }

    async function submitAuth() {
      const idVal = document.getElementById('authIdInput').value.trim();
      const passVal = document.getElementById('authPassInput').value.trim();

      if (!idVal || !passVal) {
        alert("कृपया ID और पासवर्ड दोनों भरें!");
        return;
      }

      const endpoint = isLoginMode ? `${API_BASE}/login` : `${API_BASE}/register`;

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_id: idVal, password: passVal })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          localStorage.setItem('device_5digit_code', idVal);
          localStorage.setItem('device_password', passVal);
          
          document.getElementById('devCode').innerText = idVal;
          document.getElementById('authModal').style.display = 'none';
          updateHeaderButtons();
          if(currentTab === 'notes') fetchNotes(idVal);
          else fetchGallery(idVal);
          alert(isLoginMode ? "सफलतापूर्वक लॉगिन हो गया!" : "पासवर्ड सुरक्षित हो गया!");
        } else {
          alert(data.error || "गलत पासवर्ड या आईडी!");
        }
      } catch (err) {
        alert("कनेक्शन एरर! कृपया दोबारा कोशिश करें।");
      }
    }

    function logoutUser() {
      if (confirm("क्या आप सचमुच लॉग-आउट करना चाहते हैं?")) {
        localStorage.removeItem('device_password');
        const newId = Math.floor(10000 + Math.random() * 90000).toString();
        localStorage.setItem('device_5digit_code', newId);
        
        document.getElementById('devCode').innerText = newId;
        updateHeaderButtons();
        if(currentTab === 'notes') fetchNotes(newId);
        else fetchGallery(newId);
        alert("सफलतापूर्वक लॉग-आउट हो गए!");
      }
    }

    initUser();
  </script>
</body>
</html>
