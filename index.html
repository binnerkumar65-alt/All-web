<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Cloud Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        h2 { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; color: #00bcd4; margin-top: 25px; }
        
        /* Fixed Action Bar for Deleting Photos */
        #delete-action-bar {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0;
            background: #1f1f1f;
            padding: 15px;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .btn { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #e53935; color: white; }
        .btn-cancel { background: #555; color: white; }
        .btn-primary { background: #00bcd4; color: white; }
        .btn-sm { padding: 5px 10px; font-size: 12px; margin-left: 5px; }

        /* Photo Upload Section */
        .upload-section { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .upload-form { display: flex; gap: 10px; align-items: center; }
        input[type="file"] { background: #222; padding: 8px; border-radius: 4px; color: #fff; flex: 1; border: 1px solid #333; }

        /* Gallery Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-bottom: 30px; }
        .photo-card { position: relative; width: 100%; height: 120px; border-radius: 8px; overflow: hidden; border: 3px solid transparent; cursor: pointer; user-select: none; }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .photo-card.selected { border-color: #e53935; transform: scale(0.95); }

        /* Full View Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal img { max-width: 90%; max-height: 80%; border-radius: 8px; }
        .modal-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 30px; cursor: pointer; }

        /* Notes Section */
        .note-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        textarea { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; resize: vertical; min-height: 50px; }
        .notes-list { display: flex; flex-direction: column; gap: 10px; }
        .note-card { background: #1e1e1e; padding: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #00bcd4; }
        .note-text { flex: 1; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
        .note-actions { display: flex; gap: 5px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Delete Action Bar (Photo Select Mode) -->
    <div id="delete-action-bar">
        <span id="selected-count">0 फोटो चुनी गईं</span>
        <div>
            <button class="btn btn-danger" onclick="deleteSelectedPhotos()">🗑️ डिलीट करें</button>
            <button class="btn btn-cancel" onclick="cancelSelection()">❌ Cancel</button>
        </div>
    </div>

    <!-- 1. Photo Upload Form -->
    <h2>📤 फोटो अपलोड करें</h2>
    <div class="upload-section">
        <form id="upload-form" class="upload-form" onsubmit="uploadPhoto(event)">
            <input type="file" id="photo-file" accept="image/*" required>
            <button type="submit" class="btn btn-primary" id="upload-btn">अपलोड करें</button>
        </form>
    </div>

    <!-- 2. Gallery Section -->
    <h2>📸 आपकी गैलरी</h2>
    <div class="gallery-grid" id="gallery-container">
        <!-- Photos here -->
    </div>

    <!-- Full Photo Viewer Modal -->
    <div id="photo-modal" class="modal" onclick="closePhotoModal()">
        <span class="modal-close">&times;</span>
        <img id="modal-img" src="" alt="Full View">
    </div>

    <!-- 3. Notes Section -->
    <h2>📝 आपके नोट्स</h2>
    <div class="note-input-group">
        <textarea id="new-note-input" placeholder="नया नोट लिखें..."></textarea>
        <button class="btn btn-primary" onclick="saveNote()">सेव करें</button>
    </div>
    <div class="notes-list" id="notes-container">
        <!-- Notes here -->
    </div>
</div>

<script>
const API_BASE = "https://pdf-chaker-1.onrender.com/api";
let currentDeviceId = localStorage.getItem("device_id") || "DEMO_DEVICE";

let selectedPhotos = [];
let isSelectionMode = false;
let longPressTimer = null;
let isLongPressTriggered = false;

window.onload = () => {
    loadGallery();
    fetchNotes();
};

// ==========================================
// 1. PHOTO UPLOADER & GALLERY (LONG PRESS FIX)
// ==========================================
async function uploadPhoto(e) {
    e.preventDefault();
    const fileInput = document.getElementById("photo-file");
    const uploadBtn = document.getElementById("upload-btn");
    
    if (!fileInput.files[0]) return alert("कृपया फोटो चुनें!");

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("device_id", currentDeviceId);

    try {
        uploadBtn.disabled = true;
        uploadBtn.innerText = "अपलोड हो रहा है...";
        
        const res = await fetch(`${API_BASE}/upload`, {
            method: "POST",
            body: formData
        });
        const data = await res.json();
        
        if (data.success) {
            alert("फोटो अपलोड हो गई!");
            fileInput.value = "";
            loadGallery();
        } else {
            alert("अपलोड एरर: " + (data.error || ""));
        }
    } catch (err) {
        alert("अपलोड में एरर आया!");
    } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerText = "अपलोड करें";
    }
}

async function loadGallery() {
    try {
        const res = await fetch(`${API_BASE}/gallery?device_id=${currentDeviceId}`);
        const photos = await res.json();
        const container = document.getElementById("gallery-container");
        container.innerHTML = "";

        photos.forEach(photo => {
            const card = document.createElement("div");
            card.className = "photo-card";
            card.dataset.id = photo.id;
            card.innerHTML = `<img src="${photo.url}" alt="Photo">`;
            
            setupPhotoHoldEvents(card, photo);
            container.appendChild(card);
        });
    } catch (err) {
        console.error("Gallery Error:", err);
    }
}

function setupPhotoHoldEvents(element, photo) {
    const startHold = (e) => {
        isLongPressTriggered = false;
        longPressTimer = setTimeout(() => {
            isLongPressTriggered = true;
            enableSelectionMode();
            togglePhotoSelect(element, photo.id);
        }, 500); // 500ms दबाकर रखने पर सेलेक्शन चालू होगा
    };

    const clearHold = () => {
        if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
        }
    };

    // Touch and Mouse events for Hold
    element.addEventListener("touchstart", startHold, { passive: true });
    element.addEventListener("mousedown", startHold);

    element.addEventListener("touchend", clearHold);
    element.addEventListener("mouseup", clearHold);
    element.addEventListener("touchmove", clearHold, { passive: true });

    // Click behavior
    element.addEventListener("click", (e) => {
        if (isLongPressTriggered) {
            isLongPressTriggered = false;
            return;
        }

        if (isSelectionMode) {
            togglePhotoSelect(element, photo.id);
        } else {
            openPhotoModal(photo.url);
        }
    });
}

function enableSelectionMode() {
    isSelectionMode = true;
    document.getElementById("delete-action-bar").style.display = "flex";
}

// जब तक Cancel पर क्लिक न करें, मोड चालू रहेगा
function cancelSelection() {
    isSelectionMode = false;
    selectedPhotos = [];
    document.querySelectorAll(".photo-card.selected").forEach(el => el.classList.remove("selected"));
    document.getElementById("delete-action-bar").style.display = "none";
}

function togglePhotoSelect(element, photoId) {
    const index = selectedPhotos.indexOf(photoId);
    if (index > -1) {
        selectedPhotos.splice(index, 1);
        element.classList.remove("selected");
    } else {
        selectedPhotos.push(photoId);
        element.classList.add("selected");
    }
    
    document.getElementById("selected-count").innerText = `${selectedPhotos.length} फोटो चुनी गईं`;
}

async function deleteSelectedPhotos() {
    if (selectedPhotos.length === 0) return alert("कोई फोटो सेलेक्ट नहीं है!");
    if (!confirm("क्या आप चुनी हुई फोटो डिलीट करना चाहते हैं?")) return;

    try {
        const res = await fetch(`${API_BASE}/delete`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ photo_ids: selectedPhotos })
        });
        const data = await res.json();
        if (data.success) {
            cancelSelection();
            loadGallery();
        }
    } catch (err) {
        alert("Delete करने में एरर आया!");
    }
}

function openPhotoModal(url) {
    document.getElementById("modal-img").src = url;
    document.getElementById("photo-modal").style.display = "flex";
}

function closePhotoModal() {
    document.getElementById("photo-modal").style.display = "none";
}


// ==========================================
// 2. NOTES SYSTEM (Edit & Delete)
// ==========================================
async function fetchNotes() {
    try {
        const res = await fetch(`${API_BASE}/notes?device_id=${currentDeviceId}`);
        const notes = await res.json();
        const container = document.getElementById("notes-container");
        container.innerHTML = "";

        notes.forEach(note => {
            const card = document.createElement("div");
            card.className = "note-card";
            const safeText = note.text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            
            card.innerHTML = `
                <div class="note-text">${escapeHtml(note.text)}</div>
                <div class="note-actions">
                    <button class="btn btn-primary btn-sm" onclick="editNote(${note.id}, '${safeText}')">✏️ Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteNote(${note.id})">🗑️ Delete</button>
                </div>
            `;
            container.appendChild(card);
        });
    } catch (err) {
        console.error("Notes Error:", err);
    }
}

async function saveNote() {
    const input = document.getElementById("new-note-input");
    const text = input.value.trim();
    if (!text) return alert("कृपया कुछ लिखें!");

    try {
        const res = await fetch(`${API_BASE}/notes/add`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device_id: currentDeviceId, text: text })
        });
        const data = await res.json();
        if (data.success) {
            input.value = "";
            fetchNotes();
        } else {
            alert("नोट सेव नहीं हो सका!");
        }
    } catch (err) {
        alert("सर्वर एरर!");
    }
}

async function deleteNote(msgId) {
    if (!confirm("क्या आप यह नोट डिलीट करना चाहते हैं?")) return;

    try {
        const res = await fetch(`${API_BASE}/delete`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ photo_ids: [msgId] })
        });
        const data = await res.json();
        if (data.success) {
            fetchNotes();
        }
    } catch (err) {
        alert("नोट डिलीट नहीं हो सका!");
    }
}

async function editNote(msgId, oldText) {
    const newText = prompt("नोट एडिट करें:", oldText);
    if (newText === null || newText.trim() === "" || newText.trim() === oldText) return;

    try {
        // Step 1: पुराना नोट डिलीट करें (/api/delete endpoint का उपयोग करके)
        await fetch(`${API_BASE}/delete`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ photo_ids: [msgId] })
        });

        // Step 2: नया एडिटेड नोट सेव करें
        await fetch(`${API_BASE}/notes/add`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device_id: currentDeviceId, text: newText })
        });

        fetchNotes();
    } catch (err) {
        alert("नोट अपडेट करने में एरर आया!");
    }
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>

</body>
</html>
