<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0d12; color: #f1f5f9; margin: 0; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 90px; }
    .container { width: 100%; max-width: 450px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .user-profile { display: flex; align-items: center; gap: 12px; }
    .avatar-wrapper { position: relative; cursor: pointer; }
    .avatar { width: 46px; height: 46px; background: #c7d2fe; color: #1e1b4b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; overflow: hidden; border: 2px solid #38bdf8; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-info { display: flex; flex-direction: column; }
    .app-title { font-size: 1.15rem; font-weight: 700; color: #ffffff; margin: 0; }
    .status-badge { font-size: 0.78rem; color: #94a3b8; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .status-badge .secured { color: #38bdf8; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .circle-btn { width: 42px; height: 42px; background: #1b1e26; border: 1px solid #2a2e3d; border-radius: 50%; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
    .circle-btn:hover { background: #252936; color: #fff; }
    .circle-btn.upload-btn { background: #38bdf8; color: #0b0d12; border: none; font-size: 1.1rem; }
    .circle-btn.logout-icon-btn { color: #ef4444; border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.1); }
    .circle-btn.logout-icon-btn:hover { background: #ef4444; color: #fff; }
    .nav-pill { background: #161922; border: 1px solid #232734; padding: 4px; border-radius: 30px; display: flex; margin-bottom: 20px; }
    .nav-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; border-radius: 25px; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .nav-btn.active { background: #e0f2fe; color: #0284c7; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .view-section { display: none; }
    .view-section.active { display: block; }
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .gallery-card { background: #161922; border-radius: 14px; overflow: hidden; position: relative; aspect-ratio: 1 / 1; border: 1px solid #232734; cursor: pointer; user-select: none; transition: transform 0.15s; }
    .gallery-card img, .gallery-card video { width: 100%; height: 100%; object-fit: cover; }
    .video-icon-indicator { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.6); color: #38bdf8; font-size: 0.7rem; padding: 3px 6px; border-radius: 4px; z-index: 2; }
    
    .photo-date { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.85)); font-size: 0.55rem; color: #cbd5e1; text-align: left; padding: 12px 6px 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gallery-card.selected { border: 2px solid #38bdf8; transform: scale(0.95); }
    .gallery-card.selected::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; top: 8px; right: 8px; background: #38bdf8; color: #0b0d12; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; z-index: 3; }
    
    .load-more-container { grid-column: 1 / -1; text-align: center; margin-top: 20px; }
    .load-more-btn { background: #161922; border: 1px solid #38bdf8; color: #38bdf8; padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }

    .note-box-wrapper { background: #161922; border: 1px solid #232734; border-radius: 16px; padding: 16px; margin-bottom: 24px; }
    .note-box-title { font-size: 0.95rem; font-weight: 700; color: #ffffff; margin-bottom: 12px; }
    textarea { width: 100%; height: 110px; background: #0b0d12; border: 1px solid #2a2e3d; border-radius: 12px; padding: 12px; color: #f1f5f9; font-size: 0.9rem; resize: none; margin-bottom: 12px; outline: none; }
    textarea:focus { border-color: #38bdf8; }
    .save-note-btn { width: 100%; background: #232734; color: #38bdf8; border: 1px solid #2a2e3d; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; }
    .section-subtitle { font-size: 0.95rem; font-weight: 700; color: #ffffff; margin-bottom: 12px; }
    .note-card { background: #161922; border: 1px solid #232734; border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .note-text { font-size: 0.9rem; color: #e2e8f0; word-break: break-word; line-height: 1.4; flex: 1; margin-top: 4px; }
    .note-action-btn { background: #1f2330; border: 1px solid #2a2e3d; color: #f87171; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    
    .action-bar { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #161922; border: 1px solid #2a2e3d; padding: 8px 18px; border-radius: 30px; z-index: 1500; gap: 15px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .delete-btn-bar { background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .cancel-select-btn { background: transparent; color: #94a3b8; border: none; cursor: pointer; font-size: 0.85rem; }

    /* Modal / Full View Styles */
    .modal { display: none; position: fixed; z-index: 4000; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(8px); justify-content: center; align-items: center; flex-direction: column; }
    .modal-content-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; padding: 20px; }
    .modal img, .modal video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    
    .modal-date { position: absolute; bottom: 25px; background: rgba(0, 0, 0, 0.6); padding: 6px 14px; border-radius: 20px; color: #38bdf8; font-size: 0.8rem; border: 1px solid rgba(56, 189, 248, 0.2); z-index: 4002; }
    
    /* Control Buttons Inside Modal (Top Right) */
    .modal-top-actions { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 4005; }
    .modal-action-btn { background: rgba(255,255,255,0.15); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .modal-action-btn:hover { background: rgba(255,255,255,0.3); }
    .modal-delete-btn { background: rgba(239, 68, 68, 0.85); }
    .modal-delete-btn:hover { background: #ef4444; }

    /* Navigation Arrows inside Modal */
    .modal-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15); color: #fff; border: none; width: 46px; height: 46px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; z-index: 4003; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .modal-nav-btn:hover { background: rgba(56, 189, 248, 0.5); }
    .modal-prev { left: 15px; }
    .modal-next { right: 15px; }

    /* Modal End-Of-List Load More Screen */
    .modal-loadmore-screen { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #fff; text-align: center; padding: 20px; z-index: 4005; }
    .modal-loadmore-screen h3 { margin: 0; font-size: 1.1rem; color: #94a3b8; }
    .modal-load-btn { background: #38bdf8; color: #0b0d12; border: none; padding: 12px 24px; border-radius: 25px; font-weight: 700; font-size: 0.95rem; cursor: pointer; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }

    .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 5000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 30px; font-size: 0.85rem; font-weight: 600; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .toast.success { border-color: #22c55e; color: #4ade80; }
    .toast.error { border-color: #ef4444; color: #fca5a5; }

    .auth-overlay, .confirm-overlay { display: none; position: fixed; z-index: 3000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); justify-content: center; align-items: center; padding: 20px; }
    .auth-box { background: #161922; border: 1px solid #2a2e3d; padding: 24px; border-radius: 20px; width: 100%; max-width: 360px; position: relative; }
    .auth-box h3 { margin: 0 0 6px 0; color: #fff; font-size: 1.2rem; font-weight: 700; text-align: center; }
    .auth-box p { font-size: 0.8rem; color: #94a3b8; text-align: center; margin: 0 0 16px 0; }
    .input-group { position: relative; margin-bottom: 14px; }
    .input-group label { position: absolute; top: -8px; left: 12px; background: #161922; padding: 0 4px; font-size: 0.65rem; color: #38bdf8; font-weight: 600; }
    .input-group input { width: 100%; background: #0b0d12; border: 1px solid #2a2e3d; color: #fff; border-radius: 10px; padding: 12px 12px 12px 38px; font-size: 0.9rem; outline: none; }
    .input-group i.input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
    .auth-box button.submit-btn { width: 100%; padding: 12px; background: #232734; color: #64748b; border: 1px solid #2a2e3d; font-weight: 600; border-radius: 10px; cursor: not-allowed; font-size: 0.9rem; }
    .auth-box button.submit-btn.valid-btn { background: #22c55e; color: #052e16; border-color: #22c55e; cursor: pointer; }
    .auth-box .switch-mode { font-size: 0.78rem; text-align: center; color: #94a3b8; margin-top: 16px; cursor: pointer; }
    .auth-box .switch-mode span { color: #38bdf8; font-weight: 600; }
    .confirm-box { background: #161922; border: 1px solid #ef4444; padding: 24px; border-radius: 20px; width: 100%; max-width: 340px; text-align: center; }
    .confirm-box h4 { margin: 0 0 8px 0; color: #fff; }
    .confirm-actions { display: flex; gap: 10px; margin-top: 20px; }
    .confirm-btn { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; }
    .confirm-btn.danger { background: #ef4444; color: #fff; }
    .confirm-btn.cancel { background: #232734; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <div class="container">
    <div class="header">
      <div class="user-profile">
        <div class="avatar-wrapper">
          <div class="avatar" id="avatarDisplay">CH</div>
        </div>
        <div class="user-info">
          <h2 class="app-title">Cloud Hub</h2>
          <div class="status-badge">
            ID: <span id="devCode">...</span> • <span class="secured" id="secStatus"> Connected <i class="fa-solid fa-lock"></i></span>
          </div>
        </div>
      </div>
      <div class="header-actions" id="topBtnsContainer"></div>
    </div>

    <input type="file" id="hiddenFileInput" multiple style="display: none;" onchange="uploadFilesSequentially()">

    <div class="nav-pill">
      <button class="nav-btn active" id="tabGalleryBtn" onclick="toggleView('gallery')">
        <i class="fa-regular fa-image"></i> Gallery
      </button>
      <button class="nav-btn" id="tabNotesBtn" onclick="toggleView('notes')">
        <i class="fa-regular fa-note-sticky"></i> Notes
      </button>
    </div>

    <div class="view-section active" id="gallerySection">
      <div class="gallery-grid" id="gallery"></div>
    </div>

    <div class="view-section" id="notesSection">
      <div class="note-box-wrapper">
        <div class="note-box-title">New Note</div>
        <textarea id="noteInput" placeholder="Write your cloud note here..."></textarea>
        <button class="save-note-btn" onclick="saveNote()">
          <i class="fa-solid fa-lock" style="font-size:0.8rem;"></i> Save Note
        </button>
      </div>
      <div class="section-subtitle" id="notesCountTitle">Saved Notes</div>
      <div id="notesList"></div>
    </div>
  </div>

  <div class="action-bar" id="actionBar">
    <span id="selectedCountText" style="font-size: 0.85rem; color: #38bdf8; font-weight: 600;">0 selected</span>
    <button class="delete-btn-bar" onclick="deleteSelectedPhotos()">Delete</button>
    <button class="cancel-select-btn" onclick="clearSelection()">Cancel</button>
  </div>

  <!-- Zoom Modal with Next/Prev, Swipe Support and End-of-List Load More -->
  <div class="modal" id="imgModal">
    <div class="modal-top-actions">
      <button class="modal-action-btn modal-delete-btn" id="modalDeleteBtn" onclick="deleteCurrentModalPhoto()" title="Delete Photo"><i class="fa-solid fa-trash"></i></button>
      <button class="modal-action-btn" onclick="closeZoom()" title="Close">✕</button>
    </div>

    <button class="modal-nav-btn modal-prev" id="modalPrevBtn" onclick="navigateModal(-1)"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="modal-nav-btn modal-next" id="modalNextBtn" onclick="navigateModal(1)"><i class="fa-solid fa-chevron-right"></i></button>
    
    <div class="modal-content-container" id="modalContentContainer">
      <div class="modal-date" id="modalDate"></div>
      
      <!-- End of list load more overlay inside modal -->
      <div class="modal-loadmore-screen" id="modalLoadMoreScreen">
        <i class="fa-solid fa-images" style="font-size: 2.5rem; color: #38bdf8;"></i>
        <h3>You have reached the end of loaded photos</h3>
        <button class="modal-load-btn" onclick="modalLoadMoreAction()"><i class="fa-solid fa-rotate"></i> Load More Photos</button>
      </div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="auth-overlay" id="authModal">
    <div class="auth-box">
      <button class="close-auth-modal" id="closeAuthBtn" onclick="closeAuthModal()" style="display: none; position: absolute; top: 16px; right: 16px; background: transparent; color: #94a3b8; border: none; cursor: pointer;">✕</button>
      <h3 id="authTitle">Login Account</h3>
      <p id="authSubTitle">Enter your ID and password to access your secure cloud.</p>

      <div class="input-group">
        <label>5 Digit ID</label>
        <i class="fa-solid fa-key input-icon"></i>
        <input type="text" id="authIdInput" oninput="validateAuthInputs()">
      </div>
      
      <div class="input-group">
        <label>Password</label>
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="authPassInput" placeholder="Enter password" oninput="validateAuthInputs()">
      </div>

      <button class="submit-btn" id="authBtn" onclick="submitAuth()">Login</button>
      <div class="switch-mode" id="switchText" onclick="toggleAuthMode()">Don't have an ID? <span>Register Here</span></div>
    </div>
  </div>

  <!-- Logout Warning Modal -->
  <div class="confirm-overlay" id="logoutConfirmModal">
    <div class="confirm-box">
      <i class="fa-solid fa-triangle-exclamation" style="font-size: 2.5rem; color: #ef4444; margin-bottom: 12px;"></i>
      <h4>Warning!</h4>
      <p style="font-size: 0.82rem; color: #94a3b8;">Are you sure you want to log out?</p>
      <div class="confirm-actions">
        <button class="confirm-btn cancel" onclick="closeLogoutConfirm()">Cancel</button>
        <button class="confirm-btn danger" onclick="confirmLogout()">Yes, Logout</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://pdf-chaker-1.onrender.com/api";

    const firebaseConfig = {
      databaseURL: "https://newfire-2258c-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isLoginMode = true;
    let memorySessionAuth = localStorage.getItem('is_authenticated') === 'true';
    let currentTab = 'gallery';
    
    let selectedPhotoIds = new Set();
    let isSelectionMode = false;
    let isUploading = false;

    let loadedPhotosList = [];
    let allFetchedRawData = [];
    let currentIndex = 0;
    let currentModalIndex = 0;

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function initUser() {
      let devId = localStorage.getItem('device_5digit_code') || Math.floor(10000 + Math.random() * 90000).toString();
      localStorage.setItem('device_5digit_code', devId);
      document.getElementById('devCode').innerText = devId;

      updateHeaderButtons();

      if (!memorySessionAuth) {
        showAuthPopup(true);
      } else {
        loadInitialData(devId);
      }
    }

    const DEVICE_ID = () => localStorage.getItem('device_5digit_code');

    function updateHeaderButtons() {
      const container = document.getElementById('topBtnsContainer');
      container.innerHTML = memorySessionAuth 
        ? `${currentTab==='gallery' ? '<button class="circle-btn upload-btn" onclick="triggerUpload()"><i class="fa-solid fa-plus"></i></button>':''}<button class="circle-btn logout-icon-btn" onclick="showLogoutWarning()"><i class="fa-solid fa-power-off"></i></button>`
        : `<button class="circle-btn" onclick="openLoginModal()"><i class="fa-solid fa-key"></i></button>`;
    }

    function toggleView(tab) {
      if (!memorySessionAuth) return showAuthPopup(true);
      currentTab = tab;
      document.getElementById('gallerySection').classList.toggle('active', tab === 'gallery');
      document.getElementById('notesSection').classList.toggle('active', tab === 'notes');
      document.getElementById('tabGalleryBtn').classList.toggle('active', tab === 'gallery');
      document.getElementById('tabNotesBtn').classList.toggle('active', tab === 'notes');
      updateHeaderButtons();
      if(tab === 'gallery') {
        loadInitialData(DEVICE_ID());
      } else {
        loadNotes(DEVICE_ID());
      }
    }

    function isVideoFile(url) {
      if (!url) return false;
      const cleanUrl = url.split('?')[0].toLowerCase();
      return cleanUrl.endsWith('.mp4') || cleanUrl.endsWith('.webm') || cleanUrl.endsWith('.ogg') || cleanUrl.endsWith('.mov') || url.includes('video');
    }

    function loadInitialData(targetId) {
      if (!memorySessionAuth) return;

      const galleryContainer = document.getElementById('gallery');
      galleryContainer.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#38bdf8;'><i class='fa-solid fa-spinner fa-spin'></i> Loading from Firebase...</p>";

      loadedPhotosList = [];
      allFetchedRawData = [];
      currentIndex = 0;

      db.ref(`photos/${targetId}`).once('value', (snapshot) => {
        const photos = snapshot.val();
        if (!photos) {
          galleryContainer.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#94a3b8;'>No media found.</p>";
          return;
        }

        allFetchedRawData = Object.values(photos).reverse();
        loadMoreItems();
      });

      loadNotes(targetId);
    }

    function loadMoreItems() {
      const nextBatch = allFetchedRawData.slice(currentIndex, currentIndex + 12);
      loadedPhotosList = loadedPhotosList.concat(nextBatch);
      currentIndex += 12;
      renderGalleryList();
    }

    function loadNotes(targetId) {
      const notesList = document.getElementById('notesList');
      db.ref(`notes/${targetId}`).on('value', (snapshot) => {
        const notes = snapshot.val();
        notesList.innerHTML = "";
        if (!notes) {
          document.getElementById('notesCountTitle').innerText = "Saved Notes (0)";
          notesList.innerHTML = "<p style='text-align:center; color:#94a3b8;'>No notes found.</p>";
          return;
        }

        const notesArray = Object.entries(notes);
        document.getElementById('notesCountTitle').innerText = `Saved Notes (${notesArray.length})`;

        notesArray.reverse().forEach(([key, n]) => {
          const card = document.createElement('div');
          card.className = 'note-card';
          card.innerHTML = `<div class="note-text">${n.text}</div>
            <div class="note-actions">
              <button class="note-action-btn" onclick="deleteNote('${key}')"><i class="fa-solid fa-trash"></i></button>
            </div>`;
          notesList.appendChild(card);
        });
      });
    }

    function renderGalleryList() {
      const galleryContainer = document.getElementById('gallery');
      galleryContainer.innerHTML = "";

      if (loadedPhotosList.length === 0) {
        galleryContainer.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#94a3b8;'>No media found.</p>";
        return;
      }

      loadedPhotosList.forEach((p, index) => {
        const card = document.createElement('div');
        card.className = 'gallery-card' + (selectedPhotoIds.has(p.id) ? ' selected' : '');
        
        let formattedDate = "Synced";
        if (p.date) {
          const dateObj = new Date(p.date);
          if (!isNaN(dateObj)) {
            formattedDate = dateObj.toLocaleDateString('en-GB') + " " + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          }
        }

        const isVideo = isVideoFile(p.url);

        card.onclick = () => {
          if (isSelectionMode) {
            toggleSelectPhoto(p.id, card);
          } else {
            openModal(index);
          }
        };

        card.oncontextmenu = (e) => {
          e.preventDefault();
          startSelectionMode(p.id, card);
        };

        let pressTimer;
        card.ontouchstart = () => {
          pressTimer = setTimeout(() => {
            startSelectionMode(p.id, card);
          }, 600);
        };
        card.ontouchend = () => clearTimeout(pressTimer);

        let mediaElement = '';
        if (isVideo) {
          mediaElement = `<div class="video-icon-indicator"><i class="fa-solid fa-video"></i></div><video src="${p.url}" muted preload="metadata"></video>`;
        } else {
          mediaElement = `<img src="${p.url}" loading="lazy">`;
        }

        card.innerHTML = `${mediaElement}<div class="photo-date">${formattedDate}</div>`;
        galleryContainer.appendChild(card);
      });

      if (currentIndex < allFetchedRawData.length) {
        const loadMoreDiv = document.createElement('div');
        loadMoreDiv.className = 'load-more-container';
        loadMoreDiv.innerHTML = `<button class="load-more-btn" onclick="loadMoreItems()">Load More (${allFetchedRawData.length - currentIndex} remaining)</button>`;
        galleryContainer.appendChild(loadMoreDiv);
      }
    }

    // Modal Display Logic
    function openModal(index) {
      if (!memorySessionAuth) return;
      currentModalIndex = index;
      renderModalContent();
      document.getElementById('imgModal').style.display = 'flex';
    }

    function renderModalContent() {
      const loadMoreScreen = document.getElementById('modalLoadMoreScreen');
      const prevBtn = document.getElementById('modalPrevBtn');
      const nextBtn = document.getElementById('modalNextBtn');
      const modalDate = document.getElementById('modalDate');
      const modalDeleteBtn = document.getElementById('modalDeleteBtn');
      
      const container = document.getElementById('modalContentContainer');
      const existingMedia = container.querySelector('img, video');
      if (existingMedia) existingMedia.remove();

      // Check if we hit the end load more trigger position
      if (currentModalIndex >= loadedPhotosList.length) {
        loadMoreScreen.style.display = 'flex';
        modalDate.style.display = 'none';
        modalDeleteBtn.style.display = 'none';
        prevBtn.style.display = 'flex';
        nextBtn.style.display = 'none';
        return;
      }

      loadMoreScreen.style.display = 'none';
      modalDate.style.display = 'block';
      modalDeleteBtn.style.display = 'flex';
      prevBtn.style.display = 'flex';
      nextBtn.style.display = 'flex';

      const p = loadedPhotosList[currentModalIndex];
      if (!p) return;

      let formattedDate = "Synced";
      if (p.date) {
        const dateObj = new Date(p.date);
        if (!isNaN(dateObj)) {
          formattedDate = dateObj.toLocaleDateString('en-GB') + " " + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
      }

      const isVideo = isVideoFile(p.url);
      if (isVideo) {
        const vid = document.createElement('video');
        vid.src = p.url;
        vid.controls = true;
        vid.autoplay = true;
        container.insertBefore(vid, modalDate);
      } else {
        const img = document.createElement('img');
        img.src = p.url;
        container.insertBefore(img, modalDate);
      }

      modalDate.innerText = "Date: " + formattedDate;
    }

    function navigateModal(direction) {
      currentModalIndex += direction;
      
      if (currentModalIndex < 0) {
        currentModalIndex = 0;
      } else if (currentModalIndex > loadedPhotosList.length) {
        currentModalIndex = loadedPhotosList.length;
      }
      renderModalContent();
    }

    function modalLoadMoreAction() {
      if (currentIndex < allFetchedRawData.length) {
        loadMoreItems();
        currentModalIndex = loadedPhotosList.length - 1;
        renderModalContent();
        showToast("Loaded 12 more photos!", "success");
      } else {
        showToast("No more photos available on server", "info");
      }
    }

    function closeZoom() {
      const container = document.getElementById('modalContentContainer');
      const vid = container.querySelector('video');
      if (vid) vid.pause();
      document.getElementById('imgModal').style.display = 'none';
    }

    // Touch Swipe Support for Modal
    let touchStartX = 0;
    let touchEndX = 0;

    const modalElement = document.getElementById('imgModal');
    modalElement.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    modalElement.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipeGesture();
    }, false);

    function handleSwipeGesture() {
      const threshold = 50; 
      if (touchEndX < touchStartX - threshold) {
        if (currentModalIndex < loadedPhotosList.length) {
          navigateModal(1);
        } else if (currentIndex < allFetchedRawData.length) {
          modalLoadMoreAction();
        }
      }
      if (touchEndX > touchStartX + threshold) {
        navigateModal(-1);
      }
    }

    async function deleteCurrentModalPhoto() {
      const p = loadedPhotosList[currentModalIndex];
      if (!p || !memorySessionAuth) return;
      
      showToast("Deleting file...", "info");

      try {
        const res = await fetch(`${API_BASE}/delete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_id: DEVICE_ID(), photo_ids: [p.id] })
        });
        
        if (res.ok) {
          showToast("File deleted successfully!", "success");
          closeZoom();
          loadInitialData(DEVICE_ID());
        } else {
          showToast("Delete failed!", "error");
        }
      } catch (err) {
        showToast("Server error during deletion!", "error");
      }
    }

    function startSelectionMode(id, cardElement) {
      isSelectionMode = true;
      toggleSelectPhoto(id, cardElement);
    }

    function toggleSelectPhoto(id, cardElement) {
      if (selectedPhotoIds.has(id)) {
        selectedPhotoIds.delete(id);
        cardElement.classList.remove('selected');
      } else {
        selectedPhotoIds.add(id);
        cardElement.classList.add('selected');
      }
      
      const actionBar = document.getElementById('actionBar');
      actionBar.style.display = selectedPhotoIds.size > 0 ? 'flex' : 'none';
      document.getElementById('selectedCountText').innerText = `${selectedPhotoIds.size} selected`;
      
      if (selectedPhotoIds.size === 0) {
        isSelectionMode = false;
      }
    }

    function clearSelection() {
      selectedPhotoIds.clear();
      isSelectionMode = false;
      document.getElementById('actionBar').style.display = 'none';
      document.querySelectorAll('.gallery-card').forEach(c => c.classList.remove('selected'));
    }

    async function deleteSelectedPhotos() {
      if (!memorySessionAuth) return;
      showToast("Deleting selected files...", "info");

      try {
        const res = await fetch(`${API_BASE}/delete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_id: DEVICE_ID(), photo_ids: Array.from(selectedPhotoIds) })
        });
        
        if (res.ok) {
          showToast("Files deleted successfully!", "success");
          clearSelection();
          loadInitialData(DEVICE_ID());
        } else {
          showToast("Delete failed!", "error");
        }
      } catch (err) {
        showToast("Server error during deletion!", "error");
      }
    }

    function triggerUpload() {
      if (!memorySessionAuth) return showAuthPopup(true);
      if (isUploading) return;
      const fileInput = document.getElementById('hiddenFileInput');
      fileInput.value = ""; 
      fileInput.click();
    }

    async function uploadFilesSequentially() {
      const fileInput = document.getElementById('hiddenFileInput');
      const files = fileInput.files;
      if (!files || files.length === 0 || isUploading) return;

      isUploading = true;

      for (let i = 0; i < files.length; i++) {
        showToast(`Uploading file ${i + 1} of ${files.length}...`, "info");
        const formData = new FormData();
        formData.append('file', files[i]);
        formData.append('device_id', DEVICE_ID());

        try {
          const response = await fetch(`${API_BASE}/upload`, { method: 'POST', body: formData });
          if (!response.ok) {
            showToast(`File ${i + 1} failed to upload!`, "error");
          }
        } catch (err) {
          showToast(`Network error on file ${i + 1}!`, "error");
        }
      }

      fileInput.value = "";
      isUploading = false;
      showToast("All files uploaded successfully!", "success");
      loadInitialData(DEVICE_ID());
    }

    async function saveNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();
      if (!text) return showToast("Enter text!", "error");

      try {
        await fetch(`${API_BASE}/notes/add`, { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ device_id: DEVICE_ID(), text }) 
        });
        input.value = "";
        showToast("Note saved!", "success");
      } catch (err) {
        showToast("Error saving note!", "error");
      }
    }

    async function deleteNote(id) {
      try {
        await fetch(`${API_BASE}/notes/delete`, { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ device_id: DEVICE_ID(), note_id: id }) 
        });
        showToast("Note deleted!", "success");
      } catch (err) {
        showToast("Delete failed!", "error");
      }
    }

    function validateAuthInputs() {
      const valid = document.getElementById('authIdInput').value && document.getElementById('authPassInput').value;
      document.getElementById('authBtn').classList.toggle('valid-btn', !!valid);
    }

    function showAuthPopup(login) {
      isLoginMode = login;
      document.getElementById('authModal').style.display = 'flex';
      document.getElementById('authTitle').innerText = login ? "Login Account" : "Register Account";
      document.getElementById('authBtn').innerText = login ? "Login" : "Register";
      document.getElementById('switchText').innerHTML = login ? "Don't have an ID? <span>Register Here</span>" : "Already have an account? <span>Login Here</span>";
    }

    function openLoginModal() { showAuthPopup(true); }
    function toggleAuthMode() { showAuthPopup(!isLoginMode); }

    async function submitAuth() {
      const device_id = document.getElementById('authIdInput').value.trim();
      const password = document.getElementById('authPassInput').value.trim();
      if (!device_id || !password) return;

      const endpoint = isLoginMode ? `${API_BASE}/login` : `${API_BASE}/register`;

      try {
        const res = await fetch(endpoint, { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ device_id, password }) 
        });
        const data = await res.json();
        
        if (data.success) {
          localStorage.setItem('device_5digit_code', device_id);
          memorySessionAuth = true; 
          localStorage.setItem('is_authenticated', 'true');
          document.getElementById('authModal').style.display = 'none';
          initUser(); 
          showToast(isLoginMode ? "Login successful!" : "Registered successfully!", "success");
        } else {
          showToast(data.error || "Authentication failed!", "error");
        }
      } catch (err) {
        showToast("Connection error!", "error");
      }
    }

    function showLogoutWarning() { document.getElementById('logoutConfirmModal').style.display = 'flex'; }
    function closeLogoutConfirm() { document.getElementById('logoutConfirmModal').style.display = 'none'; }
    
    function confirmLogout() {
      memorySessionAuth = false; 
      localStorage.removeItem('is_authenticated');
      closeLogoutConfirm();
      initUser(); 
      showToast("Logged out successfully", "info");
    }

    initUser();
  </script>
</body>
</html>
