<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Cloud Gallery</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
    
    /* Top Header Bar */
    .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { color: #38bdf8; margin: 0; font-size: 1.4rem; }
    
    .top-btns { display: flex; gap: 8px; }
    .icon-btn { background: #38bdf8; color: #0f172a; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(56,189,248,0.3); }
    .login-btn { background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; padding: 0 12px; height: 40px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }

    .device-info { background: #1e293b; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; margin-bottom: 20px; color: #38bdf8; border: 1px solid #334155; display: inline-block; }
    
    /* Gallery Grid System (Chote Cards) */
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 500px; }
    @media (max-width: 400px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }

    .gallery-card { background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; display: flex; flex-direction: column; cursor: pointer; aspect-ratio: 1 / 1; position: relative; }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; }
    .photo-date { position: absolute; bottom: 0; background: rgba(15, 23, 42, 0.8); width: 100%; font-size: 0.65rem; color: #cbd5e1; text-align: center; padding: 3px 0; }
    
    /* Modal / Popup Overlay */
    .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: center; flex-direction: column; padding: 20px; box-sizing: border-box; }
    .modal img { max-width: 100%; max-height: 75vh; border-radius: 8px; object-fit: contain; }
    .modal-date { margin-top: 12px; color: #38bdf8; font-size: 0.85rem; }
    .close-modal { position: absolute; top: 20px; right: 20px; background: #ef4444; color: #fff; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }

    /* Auth Setup Popup (First time or Login) */
    .auth-overlay { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
    .auth-box { background: #1e293b; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 15px; }
    .auth-box h3 { margin: 0; color: #38bdf8; text-align: center; }
    .auth-box input { padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 1rem; }
    .auth-box button { padding: 10px; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .auth-box .switch-mode { font-size: 0.8rem; text-align: center; color: #94a3b8; cursor: pointer; }
    .auth-box .switch-mode span { color: #38bdf8; text-decoration: underline; }

    #hiddenFileInput { display: none; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="header">
    <h2>Cloud Gallery</h2>
    <div class="top-btns">
      <button class="login-btn" onclick="openLoginModal()">Login</button>
      <button class="icon-btn" onclick="triggerUpload()" title="Upload Photo">+</button>
    </div>
  </div>

  <div class="device-info">🔑 ID: <strong id="devCode">...</strong></div>

  <!-- Hidden File Input for Upload -->
  <input type="file" id="hiddenFileInput" accept="image/*" onchange="uploadImage()">

  <!-- Gallery Grid Container -->
  <div class="gallery-grid" id="gallery">तस्वीरें लोड हो रही हैं...</div>

  <!-- Fullscreen Zoom Modal -->
  <div class="modal" id="imgModal">
    <button class="close-modal" onclick="closeZoom()">×</button>
    <img id="fullImg" src="">
    <div class="modal-date" id="modalDate"></div>
  </div>

  <!-- Auth / Password Setup Modal -->
  <div class="auth-overlay" id="authModal">
    <div class="auth-box">
      <h3 id="authTitle">नया अकाउंट बनाएं</h3>
      <input type="text" id="authIdInput" placeholder="5-अंक की ID (जैसे: 94315)" readonly>
      <input type="password" id="authPassInput" placeholder="अपना पासवर्ड बनाएं">
      <button id="authBtn" onclick="submitAuth()">अकाउंट सेट करें</button>
      <div class="switch-mode" id="switchText" onclick="toggleAuthMode()">पुराना अकाउंट है? <span>लॉगिन करें</span></div>
    </div>
  </div>

  <script>
    const API_BASE = "https://pdf-chaker-1.onrender.com/api";
    let isLoginMode = false;

    // Local Storage check & Setup
    function initUser() {
      let devId = localStorage.getItem('device_5digit_code');
      let pass = localStorage.getItem('device_password');

      if (!devId || !pass) {
        // नया आईडी जनरेट करना
        devId = Math.floor(10000 + Math.random() * 90000).toString();
        localStorage.setItem('device_5digit_code', devId);
        // पासवर्ड सेट करने के लिए पॉपअप दिखाना
        showAuthPopup(false);
      }
      document.getElementById('devCode').innerText = devId;
      fetchGallery(devId);
    }

    const DEVICE_ID = () => localStorage.getItem('device_5digit_code');

    // Gallery Fetcher
    async function fetchGallery(targetId) {
      try {
        const res = await fetch(`${API_BASE}/gallery?device_id=${targetId}`);
        const photos = await res.json();
        const container = document.getElementById('gallery');
        
        if (!photos || photos.length === 0) {
          container.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#94a3b8; margin-top:30px;'>कोई फोटो मौजूद नहीं है।</p>";
          return;
        }

        container.innerHTML = "";
        photos.forEach(p => {
          const card = document.createElement('div');
          card.className = 'gallery-card';
          
          const dateObj = new Date(p.date);
          const formattedDate = dateObj.toLocaleDateString() + " " + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

          card.onclick = () => openModal(p.url, formattedDate);
          
          card.innerHTML = `
            <img src="${p.url}" loading="lazy">
            <div class="photo-date">${formattedDate}</div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
      }
    }

    // Trigger Upload via Top + Button
    function triggerUpload() {
      const pass = localStorage.getItem('device_password');
      if (!pass) {
        showAuthPopup(false);
        return;
      }
      document.getElementById('hiddenFileInput').click();
    }

    // Upload Image
    async function uploadImage() {
      const fileInput = document.getElementById('hiddenFileInput');
      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('device_id', DEVICE_ID());

      // Simple loading indicator on title
      document.querySelector('h2').innerText = "Uploading...";

      try {
        const res = await fetch(`${API_BASE}/upload`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          fileInput.value = "";
          document.querySelector('h2').innerText = "Cloud Gallery";
          fetchGallery(DEVICE_ID());
        } else {
          alert("Error: " + data.error);
          document.querySelector('h2').innerText = "Cloud Gallery";
        }
      } catch (err) {
        alert("Upload Failed!");
        document.querySelector('h2').innerText = "Cloud Gallery";
      }
    }

    // Modal Zoom
    function openModal(url, dateStr) {
      document.getElementById('fullImg').src = url;
      document.getElementById('modalDate').innerText = "Uploaded: " + dateStr;
      document.getElementById('imgModal').style.display = 'flex';
    }
    function closeZoom() {
      document.getElementById('imgModal').style.display = 'none';
    }

    // Auth Popups logic
    function showAuthPopup(login) {
      isLoginMode = login;
      const modal = document.getElementById('authModal');
      const idInput = document.getElementById('authIdInput');
      const title = document.getElementById('authTitle');
      const btn = document.getElementById('authBtn');
      const switchText = document.getElementById('switchText');

      modal.style.display = 'flex';
      if (isLoginMode) {
        title.innerText = "पुराने अकाउंट में लॉगिन करें";
        idInput.removeAttribute('readonly');
        idInput.value = "";
        idInput.placeholder = "अपनी पुरानी ID डालें";
        btn.innerText = "Login करें";
        switchText.innerHTML = "नया अकाउंट बनाना है? <span>यहाँ क्लिक करें</span>";
      } else {
        title.innerText = "सुरक्षा पासवर्ड बनाएं";
        idInput.setAttribute('readonly', true);
        idInput.value = localStorage.getItem('device_5digit_code') || '';
        btn.innerText = "पासवर्ड सेट करें";
        switchText.innerHTML = "पुराना अकाउंट है? <span>लॉगिन करें</span>";
      }
    }

    function openLoginModal() {
      showAuthPopup(true);
    }

    function toggleAuthMode() {
      showAuthPopup(!isLoginMode);
    }

    function submitAuth() {
      const idVal = document.getElementById('authIdInput').value.trim();
      const passVal = document.getElementById('authPassInput').value.trim();

      if (!idVal || !passVal) {
        alert("कृपया सभी जानकारी भरें!");
        return;
      }

      if (isLoginMode) {
        // Login check (आप किसी भी डिवाइस पर पुरानी आईडी और पासवर्ड सेट कर सकते हैं)
        localStorage.setItem('device_5digit_code', idVal);
        localStorage.setItem('device_password', passVal);
        document.getElementById('devCode').innerText = idVal;
        document.getElementById('authModal').style.display = 'none';
        fetchGallery(idVal);
        alert("सफलतापूर्वक लॉगिन हो गया!");
      } else {
        // New Account Setup
        localStorage.setItem('device_password', passVal);
        document.getElementById('authModal').style.display = 'none';
        alert("पासवर्ड सुरक्षित हो गया है!");
      }
    }

    // Run on start
    initUser();
  </script>
</body>
</html>
